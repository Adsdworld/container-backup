name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the scripts
        run: |
          bash -n rootfs/usr/local/bin/backup-start
          bash -n rootfs/usr/local/bin/backup-once
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck rootfs/usr/local/bin/*
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: container-backup:test
          build-args: IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -u
          # smoke/data is left to Docker: it creates it owned by root, which the
          # container can write without DAC_OVERRIDE.
          mkdir -p smoke/source/scripts
          git config --global user.name test
          git config --global user.email test@localhost
          git -C smoke/source/scripts init -q -b main
          echo one > smoke/source/scripts/run.sh
          git -C smoke/source/scripts add . && git -C smoke/source/scripts commit -qm one
          echo notes > smoke/source/CLAUDE.md
          printf '*\n' > smoke/source/.gitignore
          printf '#!/bin/sh\ntouch /backup/data/PWNED\n' > smoke/source/scripts/.git/hooks/pre-upload
          chmod +x smoke/source/scripts/.git/hooks/pre-upload

          docker run -d --name backup --network none --cap-drop ALL --cap-add DAC_READ_SEARCH \
            -e BACKUP_INTERVAL=3 \
            -v "$PWD/smoke/source:/source/agent:ro" -v "$PWD/smoke/data:/backup/data" \
            container-backup:test
          sleep 6
          docker logs backup
          sudo git -C smoke/data/files log --oneline | grep -q 'Copy of'
          sudo git -C smoke/data/files ls-files | grep -qx agent/CLAUDE.md
          sudo git -C smoke/data/repositories/agent/scripts.git rev-parse refs/source/heads/main

          # The watched container rewrites its history.
          git -C smoke/source/scripts commit -q --amend -m forged
          sleep 6
          docker logs backup
          sudo grep -q 'heads/main was rewritten' smoke/data/ALERTS
          sudo git -C smoke/data/repositories/agent/scripts.git log --format=%s \
            "$(sudo git -C smoke/data/repositories/agent/scripts.git for-each-ref --format='%(refname)' refs/rewritten/)" \
            | grep -qx one
          test ! -e smoke/data/PWNED
          test "$(docker inspect -f '{{.State.Running}}' backup)" = true
          docker rm -f backup
      - name: Push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
