name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the scripts
        run: |
          bash -n rootfs/usr/local/bin/backup-start
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck rootfs/usr/local/bin/*
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: container-backup:test
          build-args: IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -u
          mkdir -p smoke/config smoke/source/dossier1/repo
          printf 'interval 2\n' > smoke/config/config
          echo one > smoke/source/file1
          echo two > smoke/source/dossier1/file2
          git -C smoke/source/dossier1/repo init -q
          printf '*\n' > smoke/source/.gitignore

          docker run -d --name backup --network none --cap-drop ALL --cap-add DAC_READ_SEARCH \
            -v "$PWD/smoke/config:/config:ro" -v "$PWD/smoke/source:/source:ro" -v "$PWD/smoke/data:/data" \
            container-backup:test
          sleep 5
          docker logs backup
          sudo git -C smoke/data ls-files | sort > files
          printf '%s\n' .gitignore dossier1/file2 file1 | diff - files
          sudo test ! -e smoke/data/dossier1/repo/.git

          echo changed > smoke/source/file1
          rm smoke/source/dossier1/file2
          sleep 5
          docker logs backup
          test "$(sudo git -C smoke/data show HEAD:file1)" = changed
          test "$(sudo git -C smoke/data show HEAD~1:dossier1/file2)" = two
          sudo git -C smoke/data log --format=%s | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
          test "$(docker inspect -f '{{.State.Running}}' backup)" = true
          docker rm -f backup

          printf 'every 5\n' > smoke/config/config
          docker run -d --name backup -v "$PWD/smoke/config:/config:ro" -v "$PWD/smoke/source:/source:ro" \
            -v "$PWD/smoke/data:/data" container-backup:test
          sleep 3
          docker logs backup 2>&1 | grep -q 'invalid line'
          test "$(docker inspect -f '{{.State.Running}}' backup)" = false
          docker rm -f backup
      - name: Push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
